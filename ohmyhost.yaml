version: 1
project: slop-rooster
build:
  install: npm ci --ignore-scripts
  command: npm run build
  output: dist
runtime:
  mode: edge
  egress:
    allow:
      - https://generativelanguage.googleapis.com
      - https://9e753b729403274e3c62ea1ffd4fddd7.eu.r2.cloudflarestorage.com
database:
  enabled: true
  migrations: migrations
auth:
  provider: none
mail:
  enabled: false
storage:
  provider: r2
  jurisdiction: eu
  public: false
functions:
  crons:
    - "*/5 * * * *"
